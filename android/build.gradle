apply plugin: "com.android.application"

android {
    namespace "com.rewildr.game"
    compileSdk 34

    defaultConfig {
        applicationId "com.rewildr.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            java.srcDirs = ["src/main/java"]
            assets.srcDirs = ["assets"]
            res.srcDirs = ["src/main/res"]
        }
    }
}

dependencies {
    implementation project(":core")

    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86_64"
}

configurations {
    natives
}

tasks.register("copyAndroidNatives") {
    doFirst {
        file("src/main/jniLibs/").mkdirs()

        configurations.natives.files.each { jar ->
            def outputDir = null

            if (jar.name.contains("armeabi-v7a")) {
                outputDir = file("src/main/jniLibs/armeabi-v7a")
            }

            if (jar.name.contains("arm64-v8a")) {
                outputDir = file("src/main/jniLibs/arm64-v8a")
            }

            if (jar.name.contains("x86_64")) {
                outputDir = file("src/main/jniLibs/x86_64")
            }

            copy {
                from zipTree(jar)
                into outputDir
                include "*.so"
            }
        }
    }
}

tasks.whenTaskAdded { packageTask ->
    if (packageTask.name.contains("assemble")) {
        packageTask.dependsOn "copyAndroidNatives"
    }
}