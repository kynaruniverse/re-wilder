name: Android APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Manual Gradle Wrapper Injection
        run: |
          # 1. Ensure the directory exists in the root
          mkdir -p gradle/wrapper
          
          # 2. Download the wrapper JAR directly into the root-level folder
          curl -L https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          
          # 3. If your project is nested, copy it to the android folder too just in case
          if [ -d "android" ]; then
            mkdir -p android/gradle/wrapper
            cp gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          fi
          
          # 4. Download a fresh gradlew script
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
          chmod +x gradlew

      - name: Build release APK
        run: bash gradlew android:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-wilder-apk
          path: "**/*.apk" # Search all folders for any generated APK
