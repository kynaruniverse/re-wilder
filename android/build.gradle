apply plugin: "com.android.application"

android {
    namespace "com.rewildr.game"
    compileSdk 34

    defaultConfig {
        applicationId "com.rewildr.game"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            java.srcDirs = ["src/main/java"]
            assets.srcDirs = ["assets"]
            res.srcDirs = ["src/main/res"]
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }
}

configurations {
    nativeDeps
}

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:${gdxVersion}"

    nativeDeps "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-armeabi-v7a"
    nativeDeps "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-arm64-v8a"
    nativeDeps "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-x86_64"
}

task copyNatives {
    doLast {
        def jniDir = file("src/main/jniLibs")
        jniDir.mkdirs()

        configurations.nativeDeps.files.each { jar ->
            def abi = null
            if (jar.name.contains("armeabi-v7a")) abi = "armeabi-v7a"
            else if (jar.name.contains("arm64-v8a")) abi = "arm64-v8a"
            else if (jar.name.contains("x86_64")) abi = "x86_64"

            if (abi) {
                def outDir = file("src/main/jniLibs/${abi}")
                outDir.mkdirs()
                copy {
                    from zipTree(jar)
                    into outDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.startsWith("assemble") }.configureEach {
    dependsOn copyNatives
}