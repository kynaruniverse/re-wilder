name: Android APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # This creates a fresh gradle-wrapper.jar from scratch
      - name: Force Reinstall Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          # This command downloads the wrapper via a different method that handles binaries better
          curl -L https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          
      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build release APK
        # We use 'bash gradlew' to bypass potential script execution issues
        run: bash gradlew android:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-wilder-apk
          path: android/build/outputs/apk/release/*.apk
