name: Android Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fix gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            "https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.7/gradle-wrapper-8.7.jar"
          echo "Downloaded jar size: $(stat -c%s gradle/wrapper/gradle-wrapper.jar) bytes"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add gradle/wrapper/gradle-wrapper.jar
          git diff --staged --quiet || git commit -m "ci: add valid gradle-wrapper.jar"
          git push

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate placeholder launcher icons
        run: |
          sudo apt-get install -y imagemagick -q
          mkdir -p android/src/main/res/mipmap-mdpi
          mkdir -p android/src/main/res/mipmap-hdpi
          mkdir -p android/src/main/res/mipmap-xhdpi
          mkdir -p android/src/main/res/mipmap-xxhdpi
          mkdir -p android/src/main/res/mipmap-xxxhdpi
          convert -size 48x48 xc:black \
            android/src/main/res/mipmap-mdpi/ic_launcher.png
          convert -size 72x72 xc:black \
            android/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 96x96 xc:black \
            android/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 144x144 xc:black \
            android/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 192x192 xc:black \
            android/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: re-wilder-debug.apk
          path: android/build/outputs/apk/debug/android-debug.apk