name: Android APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # This enables automatic caching of Gradle dependencies to speed up future builds
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # STEP TO REPAIR CORRUPT WRAPPER
      - name: Repair Gradle Wrapper
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          wget -P gradle/wrapper/ https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew android:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-wilder-apk
          path: android/build/outputs/apk/release/*.apk
          retention-days: 30
