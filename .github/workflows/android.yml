name: Android APK Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 1. DELETE the broken files that came from Spck/Git
      # 2. DOWNLOAD official, working versions directly into the runner
      - name: Clean and Replace Gradle Wrapper
        run: |
          rm -f gradlew
          rm -f gradle/wrapper/gradle-wrapper.jar
          # Download the Shell Script
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew -o gradlew
          # Download the Binary JAR
          curl -L https://raw.githubusercontent.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Build release APK
        # Use 'bash' explicitly to avoid any shell compatibility issues
        run: bash gradlew android:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: re-wilder-apk
          path: android/build/outputs/apk/release/*.apk
